<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Expert Chatbots</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Expert Chatbots — OpenAI & Claude Debate</h1>
    <p>Two AI models impersonate experts and debate your topic, using only real papers.</p>

    <label>Expert A (OpenAI):</label>
    <input id="expertA" placeholder="e.g., Geoffrey Hinton">

    <label>Expert B (Claude):</label>
    <input id="expertB" placeholder="e.g., Yann LeCun">

    <label>Topic:</label>
    <textarea id="topic" rows="3" placeholder="e.g., Future of AI safety"></textarea>

    <label>Total messages:</label>
    <input id="turns" type="number" value="6" min="2" max="20">

    <label>Delay between messages (seconds):</label>
    <input id="delay" type="number" value="5" min="1" max="60">

    <div class="controls-row">
      <button id="validateBtn">Validate Experts</button>
      <button id="chatBtn" disabled>Start Conversation</button>
    </div>

    <div class="status-row">
      <div id="status"></div>
      <div id="countdown"></div>
    </div>

    <div class="progress-row">
      <div class="model-indicator">
        <div>OpenAI</div>
        <div class="dots" id="dots-openai"><span></span><span></span><span></span></div>
      </div>
      <div class="model-indicator">
        <div>Claude</div>
        <div class="dots" id="dots-claude"><span></span><span></span><span></span></div>
      </div>
    </div>

    <div class="jump-row">
      <button id="jumpBtn" disabled>Jump-in</button>
      <textarea id="jumpInput" rows="2" placeholder="Your comment..." style="display:none;"></textarea>
    </div>

    <div id="transcript"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
